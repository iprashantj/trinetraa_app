<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      .navy { fill: #1a3a5c; }
      .gold { fill: #f5a623; }
      .orange { fill: #e07a2e; }
      .sky { fill: #c4e0f0; }
      .white { fill: #ffffff; }
    </style>
  </defs>
  <!-- sunburst -->
  <g>
    <polygon class="gold" points="50,10 53,32 47,32"/>
    <polygon class="orange" points="65,13 61,34 55,30"/>
    <polygon class="gold" points="78,22 68,38 63,32"/>
    <polygon class="orange" points="88,36 73,44 71,37"/>
    <polygon class="gold" points="92,53 75,52 76,47"/>
    <polygon class="orange" points="8,53 25,52 24,47"/>
    <polygon class="gold" points="12,36 27,44 29,37"/>
    <polygon class="orange" points="22,22 32,38 37,32"/>
    <polygon class="gold" points="35,13 39,34 45,30"/>
  </g>
  <!-- cat-eye glasses -->
  <ellipse class="sky" cx="24" cy="66" rx="17" ry="10" stroke="#1a3a5c" stroke-width="2"/>
  <line x1="16" y1="61" x2="32" y2="71" stroke="#34608c" stroke-width="1"/>
  <ellipse class="sky" cx="76" cy="66" rx="17" ry="10" stroke="#1a3a5c" stroke-width="2"/>
  <line x1="68" y1="61" x2="84" y2="71" stroke="#34608c" stroke-width="1"/>
  <!-- teardrop pendant -->
  <path class="navy" d="M50 8 C56 21 70 40 70 52 A20 20 0 0 1 30 52 C30 40 44 21 50 8 Z"/>
  <path class="gold" d="M50 13 C55.5 24.5 65.5 40 65.5 51.5 A15.5 15.5 0 0 1 34.5 51.5 C34.5 40 44.5 24.5 50 13 Z"/>
  <!-- eye -->
  <ellipse class="white" cx="50" cy="53" rx="9.5" ry="6.2"/>
  <circle class="navy" cx="50" cy="53" r="5.5"/>
  <circle fill="#0a0f19" cx="50" cy="53" r="2.4"/>
  <circle class="white" cx="51.7" cy="51.2" r="1.7"/>
</svg>
